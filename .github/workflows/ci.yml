name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Environment info
        run: |
          python --version
          python -m ruff --version
          python -m bandit --version
          python -m pytest --version

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Formatting (ruff format --check)
        run: python -m ruff format --check .

      - name: Security analysis (bandit)
        run: python -m bandit -r app/ -q

      - name: Tests (pytest)
        run: |
          set -o pipefail
          make test PY=python3 2>&1 | tee pytest.log

      - name: Report failure details
        if: failure()
        run: |
          if [ -f pytest.log ]; then
            msg=$(tail -n 40 pytest.log | tr '\n' '|' | cut -c1-1800 | sed 's/%/%25/g; s/::/:/g')
            echo "::error title=pytest failure::$msg"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
