name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Environment info
        run: |
          python --version
          python -m ruff --version
          python -m bandit --version
          python -m pytest --version

      - name: Quality (ruff + bandit)
        run: |
          set -o pipefail
          make quality PY=python3 2>&1 | tee quality.log

      - name: Tests (pytest)
        run: |
          set -o pipefail
          make test PY=python3 2>&1 | tee pytest.log

      - name: Report failure details
        if: failure()
        run: |
          for f in quality.log pytest.log; do
            if [ -f "$f" ]; then
              msg=$(tail -n 30 "$f" | tr '\n' '|' | cut -c1-1500 | sed 's/%/%25/g; s/::/:/g')
              echo "::error title=CI failure ($f)::$msg"
            fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
