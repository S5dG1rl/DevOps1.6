services:
  app:
    build: .
    environment:
      APP_ENV: production
      APP_VERSION: 0.1.0
      DATABASE_URL: sqlite:////app/data/alpine.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
